services:
  muxplorer:
    build:
      context: .
    image: muxplorer:0.1.6
    ports:
      - '${WEB_PORT:-8098}:8098'
    user: '${PUID:-1000}:${PGID:-1000}'
    environment:
      TZ: ${TZ:-Europe/Madrid}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - type: bind
        source: ${DOWNLOADS_PATH:-./.local/downloads}
        target: /data/downloads
      - type: bind
        source: ${PLEX_PATH:-./.local/plex}
        target: /data/plex
      - type: volume
        source: config
        target: /config
    restart: unless-stopped
    init: false
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
volumes:
  config:
