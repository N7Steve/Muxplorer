name: Validate and publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'N7Steve/Muxplorer'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/n7steve/muxplorer
      REVISION: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install workspace and native helpers
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          cc -O2 -Wall -Wextra -Werror docker/rename.c -o "$RUNNER_TEMP/mux-rename"
          cc -O2 -Wall -Wextra -Werror docker/sandbox.c -o "$RUNNER_TEMP/mux-sandbox"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Validate source
        run: |
          pnpm test
          pnpm lint
          pnpm typecheck
          pnpm format:check
          docker compose config --quiet
          docker compose -f truenas-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build candidate image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: muxplorer:ci
          labels: |
            org.opencontainers.image.source=https://github.com/N7Steve/Muxplorer
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install browser for acceptance tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Test the built image
        env:
          MUXPLORER_IMAGE: muxplorer:ci
        run: pnpm test:acceptance
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          docker tag muxplorer:ci "$IMAGE:sha-$REVISION"
          VERSION=$(node -p "require('./apps/api/package.json').version")
          docker tag muxplorer:ci "$IMAGE:$VERSION"
          docker tag muxplorer:ci "$IMAGE:latest"
          docker push "$IMAGE:sha-$REVISION"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
          echo "Published $IMAGE:$VERSION, $IMAGE:latest and $IMAGE:sha-$REVISION" >> "$GITHUB_STEP_SUMMARY"
